<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="indigoBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
  </defs>
  <!-- Dark rounded square container with indigo-purple gradient border -->
  <rect x="3" y="3" width="58" height="58" rx="14" ry="14" fill="#0D1117" stroke="url(#indigoBorder)" stroke-width="3.5" />
  <!-- Monogram PJ text -->
  <text x="32" y="33.5" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-family="'JetBrains Mono', 'Space Grotesk', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace, sans-serif" font-size="24" font-weight="700" letter-spacing="1.5">PJ</text>
</svg>